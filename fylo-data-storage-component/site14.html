<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fylo</title>
    <link rel="icon" href="Images/favicon-32x32.png">
    <link rel="stylesheet" href="css/site14.css">
</head>
<body>
    <picture>
        <source media="(max-width: 600px)" srcset="Images/bg-mobile.png">
        <img src="Images/bg-desktop.png" alt="">
    </picture>

    <div class="main-frame">
        <div class="first-block">
            <img src="Images/logo.svg" alt="" id="logo" width="120">

            <div class="flex-icons">
                <img src="Images/icon-document.svg" alt="">
                <img src="Images/icon-folder.svg" alt="">
                <img src="Images/icon-upload.svg" alt="">
            </div>
        </div>

        <div class="second-block">
            <h1>You've used <span class="gb-text">815 GB</span> of your storage</h1>

            <div class="progress-container">
                <div class="progress-line">
                    <div class="progress-sphere"></div>
                </div>
            </div>

            <div class="descp">
                <h1>0 GB</h1>
                <h2>1000 GB</h2>
            </div>

            <div class="message">
                    <span id="count">185</span> 
                    <span id="gb-left">GB LEFT</span>
            </div>
        </div>
    </div>
</body>
</html>
